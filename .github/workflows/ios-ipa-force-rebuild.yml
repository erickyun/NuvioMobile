name: Force Rebuild iOS IPA and Release

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
    paths:
      - .github/workflows/ios-ipa-force-rebuild.yml

permissions:
  contents: write

concurrency:
  group: ios-ipa-force-rebuild
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Force build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 240
    env:
      NUVIO_IOS_DISTRIBUTION: appstore

    steps:
      - name: Checkout latest upstream source
        shell: bash
        run: |
          set -euo pipefail

          git init .
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git -c submodule.recurse=false fetch \
            --depth 1 \
            --no-tags \
            --no-recurse-submodules \
            upstream cmp-rewrite
          git -c submodule.recurse=false checkout --detach FETCH_HEAD

          rm -rf MPVKit
          git clone \
            --depth 1 \
            --branch Nuvio \
            --single-branch \
            https://github.com/NuvioMedia/MPVKit.git MPVKit

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Read version information
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="iosApp/Configuration/Version.xcconfig"
          VERSION="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' "$VERSION_FILE" | tr -d '\r')"
          BUILD="$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' "$VERSION_FILE" | tr -d '\r')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"

          test -n "$VERSION"
          test -n "$BUILD"

          TAG="ios-v${VERSION}-b${BUILD}-${SHORT_SHA}-rebuild-${GITHUB_RUN_NUMBER}"
          IPA_NAME="Nuvio-${VERSION}-build-${BUILD}-rebuild-${GITHUB_RUN_NUMBER}-unsigned.ipa"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          touch local.properties

          xcodebuild -version
          xcodebuild -list -project iosApp/iosApp.xcodeproj
          java -version
          ./gradlew --version

      - name: Build unsigned iOS application
        id: ios_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/xcodebuild.log

      - name: Upload failed Xcode log
        if: always() && steps.ios_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-force-rebuild-failed-log
          path: build/xcodebuild.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail when Xcode build failed
        if: steps.ios_build.outcome == 'failure'
        shell: bash
        run: |
          tail -n 200 build/xcodebuild.log || true
          exit 1

      - name: Package IPA
        if: steps.ios_build.outcome == 'success'
        id: package
        env:
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "No .app bundle found under $PRODUCTS_DIR" >&2
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          OUTPUT_DIR="$PWD/output"
          PAYLOAD_DIR="$OUTPUT_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          ditto "$APP_PATH" "$PAYLOAD_DIR/$(basename "$APP_PATH")"

          find "$PAYLOAD_DIR" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$PAYLOAD_DIR" -type f -name embedded.mobileprovision -delete || true

          (
            cd "$OUTPUT_DIR"
            /usr/bin/zip -qry "$IPA_NAME" Payload
            shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          )

          echo "ipa_path=$OUTPUT_DIR/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_path=$OUTPUT_DIR/$IPA_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.ios_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-force-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.sha_path }}
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.ios_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Forced iOS rebuild from the latest NuvioMedia/NuvioMobile \`cmp-rewrite\` upstream source.

          Version: **$VERSION**  
          Build: **$BUILD_NUMBER**  
          Upstream commit: **$(git rev-parse HEAD)**  
          Workflow run: **$GITHUB_RUN_NUMBER**

          The IPA is **unsigned**. Sign it with your own Apple ID/certificate before sideloading.
          EOF

          gh release create "$RELEASE_TAG" \
            "$IPA_PATH" \
            "$SHA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nuvio iOS $VERSION (build $BUILD_NUMBER) - rebuild $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md \
            --latest
